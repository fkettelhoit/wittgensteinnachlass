name: Build and deploy

# Builds the full site from source (md/ + md-en/ + graphics/) and deploys it to the
# Bunny CDN. Generated artifacts (covers/, viz/, epub/, pdf/, graphics-cropped/,
# site/content, site/public) are NOT committed — they are regenerated here on every run.
#
# The build is gated by `make check`: if any English translation is missing, stale
# (the German source changed since the translation was last committed), or fails quality
# verification, the job fails and nothing is deployed.
#
# Pushes to main deploy to the production Bunny zone; pushes to any other branch deploy to
# a single shared staging zone. The target is chosen via the job's `environment`
# (production or staging), so each `secrets.*` reference below resolves to that
# environment's value with no other changes to the job.
#
# Repository secrets (shared by both environments):
#   BUNNY_STORAGE_HOST     e.g. storage.bunnycdn.com (or a region host)
#   BUNNY_API_KEY          account-level API key (for the cache purge)
#   MEILI_HOST             the (single) Meilisearch instance URL
#   MEILI_ADMIN_KEY        Meilisearch write key (shared; swap for per-env scoped keys later)
#   MEILI_SEARCH_KEY       Meilisearch read-only search key, embedded in the /search page
# Environment secrets (set in BOTH the `production` and `staging` environments, each with
# that environment's own values):
#   BUNNY_STORAGE_USER     the storage zone name
#   BUNNY_STORAGE_PASSWORD the storage zone password
#   BUNNY_PULLZONE_ID      the pull zone id (for the cache purge)
#
# The licensed SangBleu fonts are NOT stored in the repo. They live only on the Bunny CDN
# (as WOFF2), in each zone's own storage; this workflow pulls them read-only for the build
# and the deploy excludes fonts/sangbleu/ so the CDN copy is never overwritten or deleted.

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  # Serialize deploys per target: all staging branches share one queue (single shared
  # staging zone), separate from production.
  group: deploy-${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    # main -> production, every other branch -> staging. Drives which environment's
    # Bunny secrets the steps below resolve.
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    steps:
      - name: Checkout (full history — staleness detection needs it)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            tools/visualize
            tools/covers
            tools/ebooks
            tools/pdfs
            tools/translate
            tools/search-index

      # Build-broken gate. Run before installing the heavier toolchain so a broken
      # translation set fails fast and never reaches a build or deploy.
      - name: Check translations
        run: make check

      - name: Install Hugo (extended)
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: latest
          extended: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pandoc weasyprint inkscape lftp woff2 librsvg2-bin xvfb fontconfig fonttools

      - name: Configure Bunny credentials
        env:
          BUNNY_STORAGE_HOST: ${{ secrets.BUNNY_STORAGE_HOST }}
          BUNNY_STORAGE_USER: ${{ secrets.BUNNY_STORAGE_USER }}
          BUNNY_STORAGE_PASSWORD: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
        run: |
          umask 077
          cat > "$HOME/.netrc" <<EOF
          machine ${BUNNY_STORAGE_HOST}
          login ${BUNNY_STORAGE_USER}
          password ${BUNNY_STORAGE_PASSWORD}
          EOF

      - name: Fetch SangBleu fonts from Bunny and derive TTFs
        env:
          BUNNY_STORAGE_HOST: ${{ secrets.BUNNY_STORAGE_HOST }}
        run: |
          set -euo pipefail
          mkdir -p site/fonts/sangbleu build/fonts-ttf "$HOME/.local/share/fonts"
          # Pull the WOFF2 fonts read-only (they live only on the CDN).
          lftp "${BUNNY_STORAGE_HOST}" -e "
            mirror --verbose --include-glob '*.woff2' fonts/sangbleu site/fonts/sangbleu
            bye
          "
          # Inkscape (used by the covers tool) reads fonts via fontconfig, not @font-face,
          # so decompress every SangBleu WOFF2 to TTF and register them. build/fonts-ttf is
          # the directory the covers tool reads; ~/.local/share/fonts makes the same fonts
          # resolvable by family name during Inkscape's text-to-path conversion. No TTF is
          # deployed (the deploy excludes fonts/sangbleu/ and these dirs aren't part of it).
          for f in site/fonts/sangbleu/*.woff2; do woff2_decompress "$f"; done
          mv site/fonts/sangbleu/*.ttf build/fonts-ttf/
          # The "WebS" fonts ship with a stripped name table, so fontconfig (and thus
          # Inkscape, which resolves by family name — it ignores the SVG @font-face
          # file:// rule) can't find "SangBleu Empire". Restore the family names first.
          python3 tools/rename-web-fonts.py build/fonts-ttf
          cp build/fonts-ttf/*.ttf "$HOME/.local/share/fonts/"
          # Also register the committed TeX Gyre Pagella so it serves as the Inkscape
          # fallback for covers if SangBleu is ever unavailable (mirrors the CSS fallback).
          cp site/fonts/tex-gyre/*.otf "$HOME/.local/share/fonts/"
          fc-cache -f
          fc-list | grep -i sangbleu || echo "WARNING: no SangBleu family registered in fontconfig"
          fc-list | grep -i pagella || echo "WARNING: no Pagella family registered in fontconfig"

      # Inkscape (covers + graphics) needs a display on headless Linux → run under xvfb.
      # Generation is parallelized (bounded to the vCPU count) to keep the build fast.
      - name: Generate cropped graphics
        run: JOBS="$(nproc)" xvfb-run -a make graphics

      - name: Generate assets (viz, covers, epub, pdf)
        env:
          # Absolute path so the covers tool (run from tools/covers) finds the TTFs.
          COVERS_FONT_DIR: ${{ github.workspace }}/build/fonts-ttf
          # Headless Inkscape can't load @font-face file:// fonts; resolve SangBleu via
          # the fontconfig-registered (renamed) TTFs by family name instead.
          COVERS_FLAGS: --no-font-face
        run: |
          set -euo pipefail
          make check-fonts
          # Pre-build the tools sequentially so the parallel run below only executes
          # binaries — keeps several rustc compiles from contending for memory at once.
          for t in visualize covers ebooks pdfs; do (cd "tools/$t" && cargo build --release); done
          # Bounded parallelism (= vCPU count) overlaps the independent asset targets.
          xvfb-run -a make -j"$(nproc)" viz covers epub pdf

      - name: Build content and Hugo site
        # Bake the per-environment search config into the build. Hugo maps HUGO_PARAMS_* env
        # vars onto .Site.Params (lowercased), so the /search page and /js/search.js get the
        # instance URL, the read-only search key, and the branch's index — no os.Getenv (and
        # thus no Hugo security allowlist) needed.
        env:
          HUGO_PARAMS_MEILIHOST: ${{ secrets.MEILI_HOST }}
          HUGO_PARAMS_MEILISEARCHKEY: ${{ secrets.MEILI_SEARCH_KEY }}
          HUGO_PARAMS_MEILIINDEX: ${{ github.ref == 'refs/heads/main' && 'remarks-production' || 'remarks-staging' }}
        run: |
          set -euo pipefail
          make content
          hugo -s site -e production

      - name: Deploy to Bunny
        env:
          BUNNY_STORAGE_HOST: ${{ secrets.BUNNY_STORAGE_HOST }}
        run: |
          echo "Deploying branch '${GITHUB_REF_NAME}' to the '${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}' environment."
          # public/ was just built by the Hugo step above; upload it directly (no second build).
          tools/deploy_site.sh

      # Deploying updates the storage origin, but the CDN edge cache keeps serving the
      # old files until their TTL expires. Purge the whole pull zone so the new version
      # goes live immediately. Needs an account API key (Bunny dashboard → Account
      # Settings → API Key) and the numeric pull zone ID.
      - name: Purge Bunny CDN cache
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          BUNNY_PULLZONE_ID: ${{ secrets.BUNNY_PULLZONE_ID }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -X POST "https://api.bunny.net/pullzone/${BUNNY_PULLZONE_ID}/purgeCache" \
            -H "AccessKey: ${BUNNY_API_KEY}"
          echo "Purged Bunny pull zone ${BUNNY_PULLZONE_ID}."

      # Push every remark to Meilisearch so the site is searchable. Runs after the deploy and
      # is non-blocking: search is an enhancement, so a Meilisearch hiccup marks this step red
      # but never fails an otherwise-good content deploy. The host and key are shared repo
      # secrets; the target index is derived from the branch (main -> remarks-production, every
      # other branch -> remarks-staging), mirroring the `environment:` expression above. The
      # indexer builds a fresh index and atomically swaps it in, so searchers never see a
      # half-built index.
      - name: Index remarks into Meilisearch
        continue-on-error: true
        env:
          MEILI_HOST: ${{ secrets.MEILI_HOST }}
          MEILI_ADMIN_KEY: ${{ secrets.MEILI_ADMIN_KEY }}
          MEILI_INDEX_PREFIX: ${{ github.ref == 'refs/heads/main' && 'remarks-production' || 'remarks-staging' }}
        run: |
          set -euo pipefail
          cd tools/search-index
          cargo run --release -- \
            --md-dir ../../md --en-dir ../../md-en \
            --meili-host "$MEILI_HOST" \
            --meili-key "$MEILI_ADMIN_KEY" \
            --index-prefix "$MEILI_INDEX_PREFIX"
