# Editors of the published works whose arrangement the work pages (W-*.md) follow.
# Rendered below the title of each work page by layouts/partials/edition-note.html.
#
# Keys are work ids. A page uses the longest key that equals its file name or is a
# prefix of it followed by "-" (so W-RPP-2 uses W-RPP-2, W-LW-2-MS-169 uses W-LW).
#
# Fields:
#   editors: who edited the published book (shown as "Edited by <editors>")
#   year:    year of first publication of that edition
#   extra:   optional text appended after the year (HTML allowed)
#   credit:  optional full replacement for the "Edited by …" sentence (HTML allowed)

W-CE:
  editors: Rush Rhees
  year: 1976
W-EPB:
  credit: Edited by Rush Rhees (1970), who also gave it its title.
W-GB:
  editors: Rush Rhees
  year: 1967
W-LW:
  editors: G.H. von Wright and Heikki Nyman
  year: 1982–1992
W-LW-1:
  editors: G.H. von Wright and Heikki Nyman
  year: 1982
W-LW-2:
  editors: G.H. von Wright and Heikki Nyman
  year: 1992
W-NB:
  editors: G.H. von Wright and G.E.M. Anscombe
  year: 1961
W-NL:
  # The 1961 Notebooks printed the Costello version (TS 201b); the 1979 second
  # edition based Appendix I on TS 201a, which is what this page follows.
  editors: G.H. von Wright and G.E.M. Anscombe
  year: 1979
  extra: in the second edition of the <em>Notebooks 1914–1916</em>
