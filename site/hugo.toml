baseURL = 'https://www.wittgensteinnachlass.com/'
languageCode = 'de'
title = "Wittgenstein\u2019s Writings"

disableKinds = ['taxonomy', 'term']

# Transcriptions are plain prose + raw HTML; disable GFM extensions whose syntax
# (|, bare URLs, [ ]) collides with Wittgenstein's notation. See tools/sanitize_content.py.
[markup.goldmark.extensions]
typographer = false
strikethrough = false
table = false
linkify = false
taskList = false

[markup.goldmark.renderer]
unsafe = true

[markup.goldmark.parser.attribute]
block = true

[[module.mounts]]
source = "static"
target = "static"

[[module.mounts]]
source = "../css"
target = "static/css/shared"

[[module.mounts]]
source = "fonts"
target = "static/fonts"

[[module.mounts]]
source = "../viz"
target = "static/viz"

# Cropped graphics referenced by the transcriptions as ![](../graphics/<name>.svg),
# which render to <img src="/graphics/<name>.svg">. Regenerated by `make graphics`
# (output/graphics-cropped/) before the Hugo build.
[[module.mounts]]
source = "../graphics-cropped"
target = "static/graphics"

[[module.mounts]]
source = "../covers"
target = "static/covers"

[[module.mounts]]
source = "../epub"
target = "static/epub"

[[module.mounts]]
source = "../pdf"
target = "static/pdf"

[[module.mounts]]
source = "content"
target = "content"
