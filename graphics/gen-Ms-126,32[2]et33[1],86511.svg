<svg width="210mm" height="297mm" viewBox="0 0 210 297" xmlns="http://www.w3.org/2000/svg">
  <!-- Grid table with G column on left and 5x4 grid -->
  <g transform="translate(55, 110)">
    <!-- Cell size -->
    <!-- cols: G col (18w) + 4 cols of 18w each = 5 cols -->
    <!-- rows: 5 rows of 14h each -->
    
    <!-- Define dimensions -->
    <!-- cellW=18, cellH=14, 5 cols, 5 rows -->
    
    <!-- Outer border of entire table: G column + 4 columns wide, 5 rows tall -->
    <!-- G column width = 18, other 4 columns width = 18 each -->
    <!-- Total width = 18 + 4*18 = 90, Total height = 5*14 = 70 -->
    
    <!-- G cell: spans all 5 rows, first column -->
    <rect x="0" y="0" width="18" height="70" fill="none" stroke="#000" stroke-width="0.6"/>
    
    <!-- Grid area: 4 columns x 5 rows -->
    <!-- Outer border of grid -->
    <rect x="18" y="0" width="72" height="70" fill="none" stroke="#000" stroke-width="0.6"/>
    
    <!-- Horizontal lines inside grid -->
    <line x1="18" y1="14" x2="90" y2="14" stroke="#000" stroke-width="0.5"/>
    <line x1="18" y1="28" x2="90" y2="28" stroke="#000" stroke-width="0.5"/>
    <line x1="18" y1="42" x2="90" y2="42" stroke="#000" stroke-width="0.5"/>
    <line x1="18" y1="56" x2="90" y2="56" stroke="#000" stroke-width="0.5"/>
    
    <!-- Vertical lines inside grid -->
    <line x1="36" y1="0" x2="36" y2="70" stroke="#000" stroke-width="0.5"/>
    <line x1="54" y1="0" x2="54" y2="70" stroke="#000" stroke-width="0.5"/>
    <line x1="72" y1="0" x2="72" y2="70" stroke="#000" stroke-width="0.5"/>
    
    <!-- G label centered vertically in left column -->
    <text x="9" y="39" text-anchor="middle" font-size="11" fill="#000">G</text>
    
    <!-- Row 1: 1, 2, 3, S -->
    <text x="27" y="11" text-anchor="middle" font-size="9" fill="#000">1</text>
    <text x="45" y="11" text-anchor="middle" font-size="9" fill="#000">2</text>
    <text x="63" y="11" text-anchor="middle" font-size="9" fill="#000">3</text>
    <text x="81" y="11" text-anchor="middle" font-size="9" fill="#000">S</text>
    
    <!-- Row 2: 4, 5, 6, a -->
    <text x="27" y="25" text-anchor="middle" font-size="9" fill="#000">4</text>
    <text x="45" y="25" text-anchor="middle" font-size="9" fill="#000">5</text>
    <text x="63" y="25" text-anchor="middle" font-size="9" fill="#000">6</text>
    <text x="81" y="25" text-anchor="middle" font-size="9" fill="#000">a</text>
    
    <!-- Row 3: 7, 8, 9, b -->
    <text x="27" y="39" text-anchor="middle" font-size="9" fill="#000">7</text>
    <text x="45" y="39" text-anchor="middle" font-size="9" fill="#000">8</text>
    <text x="63" y="39" text-anchor="middle" font-size="9" fill="#000">9</text>
    <text x="81" y="39" text-anchor="middle" font-size="9" fill="#000">b</text>
    
    <!-- Row 4: 10, 11, 12, c -->
    <text x="27" y="53" text-anchor="middle" font-size="9" fill="#000">10</text>
    <text x="45" y="53" text-anchor="middle" font-size="9" fill="#000">11</text>
    <text x="63" y="53" text-anchor="middle" font-size="9" fill="#000">12</text>
    <text x="81" y="53" text-anchor="middle" font-size="9" fill="#000">c</text>
    
    <!-- Row 5: 13, 14, 15, W -->
    <text x="27" y="67" text-anchor="middle" font-size="9" fill="#000">13</text>
    <text x="45" y="67" text-anchor="middle" font-size="9" fill="#000">14</text>
    <text x="63" y="67" text-anchor="middle" font-size="9" fill="#000">15</text>
    <text x="81" y="67" text-anchor="middle" font-size="9" fill="#000">W</text>
  </g>
</svg>