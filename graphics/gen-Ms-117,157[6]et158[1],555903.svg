<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297">

  <!-- 13 vertical bars with numbers above -->
  <!-- Bar spacing: start at x=20, spacing=14, so bars at x=20,34,48,...,188 -->
  <!-- Bar top y=120, bar bottom y=145 -->

  <!-- Numbers above bars -->
  <text x="20" y="113" font-size="7" text-anchor="middle" fill="#000000">1</text>
  <text x="34" y="113" font-size="7" text-anchor="middle" fill="#000000">2</text>
  <text x="48" y="113" font-size="7" text-anchor="middle" fill="#000000">3</text>
  <text x="62" y="113" font-size="7" text-anchor="middle" fill="#000000">4</text>
  <text x="76" y="113" font-size="7" text-anchor="middle" fill="#000000">5</text>
  <text x="90" y="113" font-size="7" text-anchor="middle" fill="#000000">6</text>
  <text x="104" y="113" font-size="7" text-anchor="middle" fill="#000000">7</text>
  <text x="118" y="113" font-size="7" text-anchor="middle" fill="#000000">8</text>
  <text x="132" y="113" font-size="7" text-anchor="middle" fill="#000000">9</text>
  <text x="146" y="113" font-size="7" text-anchor="middle" fill="#000000">10</text>
  <text x="160" y="113" font-size="7" text-anchor="middle" fill="#000000">11</text>
  <text x="174" y="113" font-size="7" text-anchor="middle" fill="#000000">12</text>
  <text x="188" y="113" font-size="7" text-anchor="middle" fill="#000000">13</text>

  <!-- 13 vertical bars -->
  <line x1="20"  y1="116" x2="20"  y2="145" stroke="#000000" stroke-width="0.6"/>
  <line x1="34"  y1="116" x2="34"  y2="145" stroke="#000000" stroke-width="0.6"/>
  <line x1="48"  y1="116" x2="48"  y2="145" stroke="#000000" stroke-width="0.6"/>
  <line x1="62"  y1="116" x2="62"  y2="145" stroke="#000000" stroke-width="0.6"/>
  <line x1="76"  y1="116" x2="76"  y2="145" stroke="#000000" stroke-width="0.6"/>
  <line x1="90"  y1="116" x2="90"  y2="145" stroke="#000000" stroke-width="0.6"/>
  <line x1="104" y1="116" x2="104" y2="145" stroke="#000000" stroke-width="0.6"/>
  <line x1="118" y1="116" x2="118" y2="145" stroke="#000000" stroke-width="0.6"/>
  <line x1="132" y1="116" x2="132" y2="145" stroke="#000000" stroke-width="0.6"/>
  <line x1="146" y1="116" x2="146" y2="145" stroke="#000000" stroke-width="0.6"/>
  <line x1="160" y1="116" x2="160" y2="145" stroke="#000000" stroke-width="0.6"/>
  <line x1="174" y1="116" x2="174" y2="145" stroke="#000000" stroke-width="0.6"/>
  <line x1="188" y1="116" x2="188" y2="145" stroke="#000000" stroke-width="0.6"/>

  <!-- Group 1: bars 1-3 (x=20,34,48), arc center x=34, extends from x=13 to x=55 -->
  <!-- Arc: rounded bracket below bars, bulge downward, top at y=149, bottom of arc at y=157 -->
  <!-- Left arm x=13 to midpoint, right arm to x=55, bulge at x=34 y=157 -->
  <path d="M 13,149 Q 13,157 34,157 Q 55,157 55,149" stroke="#000000" stroke-width="0.6" fill="none"/>
  <!-- Vertical line from bulge downward -->
  <line x1="34" y1="157" x2="34" y2="174" stroke="#000000" stroke-width="0.6"/>

  <!-- Group 2: bars 4-6 (x=62,76,90), arc center x=76, extends from x=55 to x=97 -->
  <path d="M 55,149 Q 55,157 76,157 Q 97,157 97,149" stroke="#000000" stroke-width="0.6" fill="none"/>
  <!-- Vertical line from bulge downward -->
  <line x1="76" y1="157" x2="76" y2="174" stroke="#000000" stroke-width="0.6"/>

  <!-- Group 3: bars 7-9 (x=104,118,132), arc center x=118, extends from x=97 to x=139 -->
  <path d="M 97,149 Q 97,157 118,157 Q 139,157 139,149" stroke="#000000" stroke-width="0.6" fill="none"/>
  <!-- Vertical line from bulge downward -->
  <line x1="118" y1="157" x2="118" y2="174" stroke="#000000" stroke-width="0.6"/>

  <!-- Group 4: bars 10-12 (x=146,160,174), arc center x=160, extends from x=139 to x=181 -->
  <path d="M 139,149 Q 139,157 160,157 Q 181,157 181,149" stroke="#000000" stroke-width="0.6" fill="none"/>
  <!-- Vertical line from bulge downward -->
  <line x1="160" y1="157" x2="160" y2="174" stroke="#000000" stroke-width="0.6"/>

</svg>