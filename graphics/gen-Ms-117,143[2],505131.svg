<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297">
  <!-- Table centered in viewBox -->
  <!-- Table starts at x=80, y=120, each cell ~25x18 -->
  
  <!-- Outer border -->
  <rect x="80" y="118" width="50" height="72" fill="none" stroke="#000000" stroke-width="0.6"/>
  
  <!-- Vertical divider between columns -->
  <line x1="105" y1="118" x2="105" y2="190" stroke="#000000" stroke-width="0.6"/>
  
  <!-- Horizontal dividers between rows -->
  <line x1="80" y1="136" x2="130" y2="136" stroke="#000000" stroke-width="0.6"/>
  <line x1="80" y1="154" x2="130" y2="154" stroke="#000000" stroke-width="0.6"/>
  <line x1="80" y1="172" x2="130" y2="172" stroke="#000000" stroke-width="0.6"/>
  
  <!-- Row 1: a | → -->
  <text x="92" y="131" font-size="10" text-anchor="middle" fill="#000000">a</text>
  <text x="117" y="131" font-size="10" text-anchor="middle" fill="#000000">→</text>
  
  <!-- Row 2: b | ← -->
  <text x="92" y="149" font-size="10" text-anchor="middle" fill="#000000">b</text>
  <text x="117" y="149" font-size="10" text-anchor="middle" fill="#000000">←</text>
  
  <!-- Row 3: c | ↑ -->
  <text x="92" y="167" font-size="10" text-anchor="middle" fill="#000000">c</text>
  <text x="117" y="167" font-size="10" text-anchor="middle" fill="#000000">↑</text>
  
  <!-- Row 4: d | ↓ -->
  <text x="92" y="185" font-size="10" text-anchor="middle" fill="#000000">d</text>
  <text x="117" y="185" font-size="10" text-anchor="middle" fill="#000000">↓</text>
</svg>