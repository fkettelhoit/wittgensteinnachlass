<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297">
  <!-- Vertical bar separating left and right columns -->
  <line x1="108" y1="133" x2="108" y2="170" stroke="#000000" stroke-width="0.7"/>
  
  <!-- Left column: ~g, g, g -->
  <text x="96" y="142" font-size="11" fill="#000000" text-anchor="end">~g</text>
  <text x="96" y="155" font-size="11" fill="#000000" text-anchor="end">g</text>
  <text x="96" y="168" font-size="11" fill="#000000" text-anchor="end">g</text>
  
  <!-- Right column: ~s, s, ~s -->
  <text x="120" y="142" font-size="11" fill="#000000" text-anchor="start">~s</text>
  <text x="120" y="155" font-size="11" fill="#000000" text-anchor="start">s</text>
  <text x="120" y="168" font-size="11" fill="#000000" text-anchor="start">~s</text>
</svg>