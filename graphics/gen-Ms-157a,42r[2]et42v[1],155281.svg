<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297">
  <!-- Diagram showing a path following the rule →↓→→↑ -->
  <!-- The manuscript shows a path that goes: right, down, right, right, up -->
  <!-- Starting point around (70, 138) -->
  <!-- Each step = 20 units -->
  <!-- Points:
    Start (70,138) →right (90,138) →down (90,158) →right (110,158) →right (130,158) →up (130,138)
  -->

  <g stroke="#000000" stroke-width="0.6" fill="none">
    <!-- Arrow 1: right (70,138) to (90,138) -->
    <line x1="70" y1="138" x2="88" y2="138"/>
    <polygon fill="#000000" stroke="none" points="90,138 86,136 86,140"/>

    <!-- Arrow 2: down (90,138) to (90,158) -->
    <line x1="90" y1="138" x2="90" y2="156"/>
    <polygon fill="#000000" stroke="none" points="90,158 88,154 92,154"/>

    <!-- Arrow 3: right (90,158) to (110,158) -->
    <line x1="90" y1="158" x2="108" y2="158"/>
    <polygon fill="#000000" stroke="none" points="110,158 106,156 106,160"/>

    <!-- Arrow 4: right (110,158) to (130,158) -->
    <line x1="110" y1="158" x2="128" y2="158"/>
    <polygon fill="#000000" stroke="none" points="130,158 126,156 126,160"/>

    <!-- Arrow 5: up (130,158) to (130,138) -->
    <line x1="130" y1="158" x2="130" y2="140"/>
    <polygon fill="#000000" stroke="none" points="130,138 128,142 132,142"/>
  </g>
</svg>