<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297">
  <!-- Label "c" centered above the top bracket -->
  <text x="105" y="128" font-size="11" text-anchor="middle" fill="#000000">c</text>
  
  <!-- Top bracket: horizontal line with downward ticks at ends -->
  <!-- Main horizontal line for top bracket -->
  <line x1="62" y1="138" x2="148" y2="138" stroke="#000000" stroke-width="0.6"/>
  <!-- Left tick (downward) -->
  <line x1="62" y1="133" x2="62" y2="143" stroke="#000000" stroke-width="0.6"/>
  <!-- Right tick (downward) -->
  <line x1="148" y1="133" x2="148" y2="143" stroke="#000000" stroke-width="0.6"/>
  
  <!-- Bottom bracket: horizontal line with ticks at ends and a divider -->
  <!-- Main horizontal line for bottom bracket -->
  <line x1="62" y1="155" x2="148" y2="155" stroke="#000000" stroke-width="0.6"/>
  <!-- Left tick -->
  <line x1="62" y1="150" x2="62" y2="160" stroke="#000000" stroke-width="0.6"/>
  <!-- Right tick -->
  <line x1="148" y1="150" x2="148" y2="160" stroke="#000000" stroke-width="0.6"/>
  <!-- Middle divider tick -->
  <line x1="88" y1="150" x2="88" y2="160" stroke="#000000" stroke-width="0.6"/>
  
  <!-- Label "a" below left segment -->
  <text x="75" y="174" font-size="11" text-anchor="middle" fill="#000000">a</text>
  
  <!-- Label "b" below right segment -->
  <text x="118" y="174" font-size="11" text-anchor="middle" fill="#000000">b</text>
</svg>